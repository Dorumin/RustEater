[package]
name = "rusteater"
version = "0.1.0"
authors = ["Naughty <dorminsama@gmail.com>"]
edition = "2018"

[dependencies]
structopt = "0.3.26"
reqwest = { version = "0.11.12", features = ["json"] }
serde = { version = "1.0.147", features = ["derive"] }
serde_json = "1.0.87"
tokio = { version = "1.21.2", features = ["tokio-macros", "macros", "rt-multi-thread"] }
# async-std = { version = "1.12.0", features = ["attributes", "tokio02"] }
